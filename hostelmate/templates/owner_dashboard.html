<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Owner Dashboard | HostelMate</title>
    <link rel="stylesheet" href="{% static 'css/owner_dashboard.css' %}">
</head>

<body>

    <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">Hostel<span>Mate</span></div>

    <div class="nav-links">
        <a href="{% url 'owner_dashboard' %}">Dashboard</a>
        <a href="{% url 'owner_hostels' %}">My Hostels</a>
        <a href="{% url 'owner_payments' %}">Payments</a>
        <a href="{% url 'logout' %}" class="logout">Logout</a>
    </div>
</nav>



    <div class="dashboard">

        <!-- ADD HOSTEL -->
        <section class="card">
            <h2>Add New Hostel</h2>

            <!-- IMPORTANT: enctype added -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <input type="text" name="name" placeholder="Hostel Name" required>

                <select name="category" required>
                    <option value="">Category</option>
                    <option value="gents">Gents</option>
                    <option value="ladies">Ladies</option>
                </select>

                <input type="text" name="location" placeholder="Location" required>
                <input type="number" name="beds" placeholder="Beds Available" required>
                <input type="number" name="price" placeholder="Price per Bed" required>

                <!-- IMAGE UPLOAD -->
                <div class="image-upload">
                    <label>Hostel Image</label>
                    <input type="file" name="image" accept="image/*" required>
                </div>

                <button type="submit">Add Hostel</button>
            </form>
        </section>

        

        <!-- BOOKING REQUESTS -->
        <section class="card">
            <h2>Booking Requests</h2>

            {% for req in requests %}
            <div class="request-item">
                <div>
                    <strong>{{ req.user.username }}</strong>
                    <p>{{ req.hostel.name }}</p>
                </div>

                <a href="{% url 'accept_request' req.id %}" class="accept">Accept</a>
            </div>
            {% empty %}
            <p>No pending requests</p>
            {% endfor %}
        </section>

    </div>

</body>

</html>
